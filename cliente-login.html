<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | S7TE</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a2a6e'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='55' font-weight='900' fill='%23fbbf24' text-anchor='middle'%3ES7%3C/text%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cobalt-deep: #0a2a6e;
            --cobalt-main: #1a4fb8;
            --cobalt-bright: #2563eb;
            --gold: #fbbf24;
            --gold-dark: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--cobalt-deep) 0%, var(--cobalt-main) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--cobalt-deep);
            letter-spacing: -0.02em;
        }

        .login-logo .logo-text span {
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-gray);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cobalt-main);
            background: white;
            box-shadow: 0 0 0 4px rgba(26, 79, 184, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-gray);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            cursor: pointer;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            accent-color: var(--cobalt-main);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--cobalt-main);
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            color: white;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 79, 184, 0.4);
        }

        .btn-login:disabled {
            background: var(--text-gray);
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .success-message.show {
            display: flex;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-gray);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .register-link {
            text-align: center;
            margin-top: 24px;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .register-link a {
            color: var(--cobalt-main);
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link a:hover {
            color: var(--cobalt-main);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }
            
            .login-logo .logo-text {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-text">S<span>7</span>TE</div>
                <div class="subtitle">Entre na sua conta</div>
            </div>

            <div class="error-message" id="error-message">
                <span>⚠️</span>
                <span id="error-text">E-mail ou senha incorretos</span>
            </div>

            <div class="success-message" id="success-message">
                <span>✅</span>
                <span id="success-text">Login realizado!</span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>E-mail</label>
                    <div class="input-wrapper">
                        <span class="icon">📧</span>
                        <input 
                            type="email" 
                            class="form-input" 
                            id="email" 
                            placeholder="seu@email.com"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <span class="icon">🔒</span>
                        <input 
                            type="password" 
                            class="form-input" 
                            id="senha" 
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()" id="toggle-btn">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" checked>
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="cliente-recuperar-senha.html" class="forgot-link">Esqueci a senha</a>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text">Entrar</span>
                </button>
            </form>

            <div class="divider">ou</div>

            <div class="register-link">
                Não tem conta? <a href="cliente-registro.html">Criar conta grátis</a>
            </div>

            <div class="back-link">
                <a href="index.html">← Voltar para a loja</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ksqutwabqqkkthpqdpqo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzcXV0d2FicXFra3RocHFkcHFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Mzc3MTQsImV4cCI6MjEwNDMxMzcxNH0.zctTCekjtWs7jElZoEIddw6UbEpTOqklnJS54uufGlY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function togglePassword() {
            const senhaInput = document.getElementById('senha');
            const toggleBtn = document.getElementById('toggle-btn');
            
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                senhaInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        async function fazerLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');

            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');

            if (!email || !senha) {
                document.getElementById('error-text').textContent = 'Preencha todos os campos';
                document.getElementById('error-message').classList.add('show');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Entrando...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (error) throw error;

                document.getElementById('success-text').textContent = 'Login realizado! Redirecionando...';
                document.getElementById('success-message').classList.add('show');

                // Verificar se veio de um redirect (checkout)
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');

                setTimeout(() => {
                    if (redirect) {
                        window.location.href = redirect;
                    } else {
                        window.location.href = 'minha-conta.html';
                    }
                }, 800);

            } catch (error) {
                console.error('Erro no login:', error);
                
                let mensagemErro = 'E-mail ou senha incorretos';
                
                if (error.message.includes('Invalid login credentials')) {
                    mensagemErro = 'E-mail ou senha incorretos';
                } else if (error.message.includes('Email not confirmed')) {
                    mensagemErro = 'E-mail não confirmado. Verifique sua caixa de entrada.';
                } else if (error.message.includes('rate limit')) {
                    mensagemErro = 'Muitas tentativas. Aguarde alguns minutos.';
                }

                document.getElementById('error-text').textContent = mensagemErro;
                document.getElementById('error-message').classList.add('show');

                btn.disabled = false;
                btnText.textContent = 'Entrar';
                document.getElementById('senha').value = '';
                document.getElementById('senha').focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Verificar se já está logado
            supabaseClient.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');
                    window.location.href = redirect || 'minha-conta.html';
                }
            });

            document.getElementById('email').focus();
            document.getElementById('login-form').addEventListener('submit', fazerLogin);
        });
    </script>
</body>
</html>
