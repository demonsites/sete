<html lang="pt-BR">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cobalt-deep: #0a2a6e;
            --cobalt-main: #1a4fb8;
            --cobalt-bright: #2563eb;
            --gold: #fbbf24;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--cobalt-deep) 0%, var(--cobalt-main) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-logo .logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--cobalt-deep);
            letter-spacing: -0.02em;
        }

        .register-logo .logo-text span {
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-logo .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .form-group label .req {
            color: var(--danger);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--text-gray);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cobalt-main);
            background: white;
            box-shadow: 0 0 0 4px rgba(26, 79, 184, 0.1);
        }

        .form-input.error {
            border-color: var(--danger);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-gray);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Seletor de tipo de pessoa */
        .person-type-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .person-type-option {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .person-type-option:hover {
            border-color: var(--cobalt-main);
        }

        .person-type-option.selected {
            border-color: var(--cobalt-main);
            background: rgba(26, 79, 184, 0.05);
        }

        .person-type-option input {
            display: none;
        }

        .person-type-option .icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .person-type-option .label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .person-type-option .sublabel {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 2px;
        }

        /* Campo de razão social (oculto por padrão) */
        .razao-social-group {
            display: none;
        }

        .razao-social-group.show {
            display: block;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .terms-check input {
            width: 18px;
            height: 18px;
            accent-color: var(--cobalt-main);
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .terms-check a {
            color: var(--cobalt-main);
            font-weight: 600;
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            color: white;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 79, 184, 0.4);
        }

        .btn-register:disabled {
            background: var(--text-gray);
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .success-message.show {
            display: flex;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-gray);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--cobalt-main);
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link a:hover {
            color: var(--cobalt-main);
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 32px 20px;
            }
            
            .register-logo .logo-text {
                font-size: 1.8rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .person-type-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">

    <script>
        const SUPABASE_URL = 'https://ksqutwabqqkkthpqdpqo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzcXV0d2FicXFra3RocHFkcHFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Mzc3MTQsImV4cCI6MjEwNDMxMzcxNH0.zctTCekjtWs7jElZoEIddw6UbEpTOqklnJS54uufGlY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tipoDocumento = 'cpf';

        function togglePassword(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {

                btn.textContent = '👁️';
            }
        }

        function selecionarTipoPessoa(tipo) {
            tipoDocumento = tipo;
            
            // Atualizar seleção visual
            document.querySelectorAll('.person-type-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // Atualizar campo de documento
            const docInput = document.getElementById('documento');
            const docLabel = document.getElementById('doc-label');
            const razaoSocialGroup = document.getElementById('razao-social-group');
            
            if (tipo === 'cpf') {
                docLabel.innerHTML = 'CPF <span class="req">*</span>';
                docInput.placeholder = '000.000.000-00';

                razaoSocialGroup.classList.remove('show');
            } else {

                docInput.placeholder = '00.000.000/0000-00';

            // Limpar campo
            docInput.value = '';
        }

        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            
            let soma = 0;
            for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
            let resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(9))) return false;
            
            soma = 0;
            for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            return resto === parseInt(cpf.charAt(10));
        }

        function validarCNPJ(cnpj) {
            cnpj = cnpj.replace(/\D/g, '');
            if (cnpj.length !== 14 || /^(\d)\1{13}$/.test(cnpj)) return false;
            
            // Validação do primeiro dígito
            let soma = 0;
            let pesos = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
            for (let i = 0; i < 12; i++) {
                soma += parseInt(cnpj.charAt(i)) * pesos[i];
            }
            let resto = soma % 11;
            let dv1 = resto < 2 ? 0 : 11 - resto;
            if (parseInt(cnpj.charAt(12)) !== dv1) return false;
            
            // Validação do segundo dígito
            soma = 0;
            pesos = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
            for (let i = 0; i < 13; i++) {
                soma += parseInt(cnpj.charAt(i)) * pesos[i];
            }
            resto = soma % 11;
            let dv2 = resto < 2 ? 0 : 11 - resto;
            if (parseInt(cnpj.charAt(13)) !== dv2) return false;
            
            return true;
        }

        function aplicarMascaras() {
            const doc = document.getElementById('documento');
            doc.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                
                if (tipoDocumento === 'cpf') {
                    if (v.length > 11) v = v.substring(0, 11);
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                } else {
                    if (v.length > 14) v = v.substring(0, 14);
                    v = v.replace(/(\d{2})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d)/, '$1/$2');
                    v = v.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
                }
                
                e.target.value = v;
            });

            const tel = document.getElementById('telefone');
            tel.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.substring(0, 11);
                if (v.length > 10) {
                    v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
                } else if (v.length > 6) {
                    v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                } else if (v.length > 2) {
                    v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
                }
                e.target.value = v;
            });
        }

        async function criarConta(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const documento = document.getElementById('documento').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;
            const termos = document.getElementById('termos').checked;
            const razaoSocial = document.getElementById('razao-social').value.trim();

            const btn = document.getElementById('btn-register');
            const btnText = document.getElementById('btn-text');

            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');

            // Validações
            if (!nome || !documento || !telefone || !email || !senha) {
                document.getElementById('error-text').textContent = 'Preencha todos os campos obrigatórios';
                document.getElementById('error-message').classList.add('show');
                return;
            }

            // Validar documento conforme o tipo
            if (tipoDocumento === 'cpf') {
                if (!validarCPF(documento)) {
                    document.getElementById('error-text').textContent = 'CPF inválido. Verifique os dígitos.';
                    document.getElementById('error-message').classList.add('show');
                    document.getElementById('documento').focus();
                    return;
                }
            } else {
                if (!validarCNPJ(documento)) {
                    document.getElementById('error-text').textContent = 'CNPJ inválido. Verifique os dígitos.';
                    document.getElementById('error-message').classList.add('show');
                    document.getElementById('documento').focus();
                    return;
                }
                
                if (!razaoSocial) {
                    document.getElementById('error-text').textContent = 'Preencha a razão social da empresa';
                    document.getElementById('error-message').classList.add('show');
                    document.getElementById('razao-social').focus();
                    return;
                }
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                document.getElementById('error-text').textContent = 'E-mail inválido';
                document.getElementById('error-message').classList.add('show');
                document.getElementById('email').focus();
                return;
            }

            if (senha.length < 6) {
                document.getElementById('error-text').textContent = 'A senha deve ter no mínimo 6 caracteres';
                document.getElementById('error-message').classList.add('show');
                document.getElementById('senha').focus();
                return;
            }

            if (senha !== confirmarSenha) {
                document.getElementById('error-text').textContent = 'As senhas não coincidem';
                document.getElementById('error-message').classList.add('show');
                document.getElementById('confirmar-senha').focus();
                return;
            }

            if (!termos) {
                document.getElementById('error-text').textContent = 'Você precisa aceitar os termos de uso';
                document.getElementById('error-message').classList.add('show');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Criando conta...';

            try {
                const metadata = {
                    nome: nome,
                    documento: documento.replace(/\D/g, ''),
                    tipo_documento: tipoDocumento,
                    telefone: telefone
                };
                
                if (tipoDocumento === 'cnpj') {
                    metadata.razao_social = razaoSocial;
                }

                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: senha,
                    options: {
                        data: metadata
                    }
                });

                if (error) throw error;

                document.getElementById('success-text').textContent = 'Conta criada com sucesso! Redirecionando...';
                document.getElementById('success-message').classList.add('show');

                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');

                setTimeout(() => {
                    if (redirect) {
                        window.location.href = redirect;
                    } else {
                        window.location.href = 'minha-conta.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('Erro ao criar conta:', error);
                
                let mensagemErro = 'Erro ao criar conta. Tente novamente.';
                
                if (error.message.includes('already registered')) {
                    mensagemErro = 'Este e-mail já está cadastrado. Faça login.';
                } else if (error.message.includes('Password should be at least')) {
                    mensagemErro = 'A senha deve ter no mínimo 6 caracteres';
                } else if (error.message.includes('Invalid email')) {
                    mensagemErro = 'E-mail inválido';
                } else if (error.message.includes('rate limit')) {
                    mensagemErro = 'Muitas tentativas. Aguarde alguns minutos.';
                }

                document.getElementById('error-text').textContent = mensagemErro;
                document.getElementById('error-message').classList.add('show');

                btn.disabled = false;
                btnText.textContent = 'Criar Conta';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            supabaseClient.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');
                    window.location.href = redirect || 'minha-conta.html';
                }
            });

            aplicarMascaras();
            document.getElementById('nome').focus();
            document.getElementById('register-form').addEventListener('submit', criarConta);
        });
    </script>
</body>
</html>
