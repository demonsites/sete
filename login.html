<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | S7TE</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cobalt-deep: #0a2a6e;
            --cobalt-main: #1a4fb8;
            --cobalt-bright: #2563eb;
            --cobalt-light: #60a5fa;
            --gold: #fbbf24;
            --gold-dark: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-white: #ffffff;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, var(--cobalt-deep) 0%, var(--cobalt-main) 50%, var(--cobalt-bright) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Elementos decorativos de fundo */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Container principal */
        .login-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
        }

        /* Card de login */
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        /* Logo */
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--cobalt-deep);
            letter-spacing: -0.02em;
        }
        .login-logo .logo-text span {
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-logo .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-top: 8px;
            font-weight: 500;
        }
        .login-logo .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--cobalt-deep);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 12px;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .form-group label .req {
            color: var(--danger);
        }

        .input-wrapper {
            position: relative;
        }
        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-gray);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--bg-light);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--cobalt-main);
            background: white;
            box-shadow: 0 0 0 4px rgba(26, 79, 184, 0.1);
        }
        .form-input.error {
            border-color: var(--danger);
        }

        /* Toggle de senha */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-gray);
            transition: var(--transition);
        }
        .password-toggle:hover {
            color: var(--cobalt-main);
        }

        /* Lembrar e esqueci */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            cursor: pointer;
        }
        .remember-me input {
            width: 16px;
            height: 16px;
            accent-color: var(--cobalt-main);
            cursor: pointer;
        }
        .forgot-link {
            color: var(--cobalt-main);
            font-weight: 600;
            text-decoration: none;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Botão de login */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--cobalt-main), var(--cobalt-bright));
            color: white;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(26, 79, 184, 0.3);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 79, 184, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            background: var(--text-gray);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Spinner de loading */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mensagem de erro */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-message.show {
            display: flex;
        }

        /* Mensagem de sucesso */
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .success-message.show {
            display: flex;
        }

        /* Divisor */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-gray);
            font-size: 0.8rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        /* Link voltar */
        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        .back-link a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link a:hover {
            color: var(--cobalt-main);
        }

        /* Info de segurança */
        .security-info {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--text-gray);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-card { padding: 36px 24px; }
            .login-logo .logo-text { font-size: 2rem; }
            .form-options { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-text">S<span>7</span>TE</div>
                <div class="subtitle">Painel Administrativo</div>
                <div class="admin-badge">🔐 Área Restrita</div>
            </div>

            <div class="error-message" id="error-message">
                <span>⚠️</span>
                <span id="error-text">E-mail ou senha incorretos</span>
            </div>

            <div class="success-message" id="success-message">
                <span>✅</span>
                <span id="success-text">Login realizado com sucesso!</span>
            </div>

            <form id="login-form" onsubmit="fazerLogin(event)">
                <div class="form-group">
                    <label>E-mail <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon">📧</span>
                        <input 
                            type="email" 
                            class="form-input" 
                            id="email" 
                            placeholder="admin@s7te.com.br"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon">🔒</span>
                        <input 
                            type="password" 
                            class="form-input" 
                            id="senha" 
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()" id="toggle-btn">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" checked>
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="recuperarSenha(event)">Esqueci a senha</a>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text">Entrar</span>
                </button>
            </form>

            <div class="divider">ou</div>

            <div class="back-link">
                <a href="../index.html">← Voltar para a loja</a>
            </div>

            <div class="security-info">
                🔒 Conexão segura e criptografada
            </div>
        </div>

        <div class="login-footer">
            © 2026 S7TE Tecnologia em Odontologia
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://ksqutwabqqkkthpqdpqo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzcXV0d2FicXFra3RocHFkcHFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Mzc3MTQsImV4cCI6MjEwNDMxMzcxNH0.zctTCekjtWs7jElZoEIddw6UbEpTOqklnJS54uufGlY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // VERIFICAR SE JÁ ESTÁ LOGADO
        // ============================================
        async function verificarSessao() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    // Já está logado, redirecionar para o painel
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Erro ao verificar sessão:', error);
            }
        }

        // ============================================
        // TOGGLE DE SENHA
        // ============================================
        function togglePassword() {
            const senhaInput = document.getElementById('senha');
            const toggleBtn = document.getElementById('toggle-btn');
            
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                senhaInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // ============================================
        // FAZER LOGIN
        // ============================================
        async function fazerLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const successMsg = document.getElementById('success-message');

            // Esconder mensagens anteriores
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            // Validação básica
            if (!email || !senha) {
                errorText.textContent = 'Preencha todos os campos';
                errorMsg.classList.add('show');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorText.textContent = 'E-mail inválido';
                errorMsg.classList.add('show');
                return;
            }

            // Estado de loading
            btn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Entrando...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (error) throw error;

                // Login successful
                successMsg.classList.add('show');
                document.getElementById('success-text').textContent = 'Login realizado! Redirecionando...';

                // Aguardar um pouco para mostrar a mensagem de sucesso
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);

            } catch (error) {
                console.error('Erro no login:', error);
                
                // Mensagens de erro amigáveis
                let mensagemErro = 'E-mail ou senha incorretos';
                
                if (error.message.includes('Invalid login credentials')) {
                    mensagemErro = 'E-mail ou senha incorretos';
                } else if (error.message.includes('Email not confirmed')) {
                    mensagemErro = 'E-mail não confirmado. Verifique sua caixa de entrada.';
                } else if (error.message.includes('rate limit')) {
                    mensagemErro = 'Muitas tentativas. Aguarde alguns minutos.';
                } else if (error.message.includes('network')) {
                    mensagemErro = 'Erro de conexão. Verifique sua internet.';
                }

                errorText.textContent = mensagemErro;
                errorMsg.classList.add('show');

                // Resetar botão
                btn.disabled = false;
                btnText.textContent = 'Entrar';

                // Limpar senha
                document.getElementById('senha').value = '';
                document.getElementById('senha').focus();
            }
        }

        // ============================================
        // RECUPERAR SENHA
        // ============================================
        async function recuperarSenha(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const successMsg = document.getElementById('success-message');

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            if (!email) {
                errorText.textContent = 'Digite seu e-mail no campo acima para recuperar a senha';
                errorMsg.classList.add('show');
                document.getElementById('email').focus();
                return;
            }

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/admin/login.html'
                });

                if (error) throw error;

                document.getElementById('success-text').textContent = '📧 E-mail de recuperação enviado! Verifique sua caixa de entrada.';
                successMsg.classList.add('show');

            } catch (error) {
                console.error('Erro ao recuperar senha:', error);
                errorText.textContent = 'Erro ao enviar e-mail de recuperação. Tente novamente.';
                errorMsg.classList.add('show');
            }
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            verificarSessao();
            
            // Focar no campo de e-mail
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
